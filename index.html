<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系所行事曆</title>
<meta name="description" content="機械與自動化工程系系務行事曆">
<meta name="theme-color" content="#1e3a5f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css?v=9462d0ab">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- GSAP：今天的事件進場與脈動動畫（載入失敗會自動略過，不影響月曆） -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <div class="brand">
      <h1><span id="site-title">系所行事曆</span></h1>
      <p id="site-subtitle">系務行程公告</p>
    </div>

    <!-- 兩個主要功能做成頁籤：一眼看得出有兩個分頁可切 -->
    <nav class="site-tabs" aria-label="主要功能">
      <a href="index.html" class="tab is-active" aria-current="page">行事曆</a>
      <a href="records.html" class="tab">公差/招生記錄</a>
      <a href="survey.html" class="tab">調查專區</a>
      <a href="rooms.html" class="tab">教室課表</a>
    </nav>

    <!-- 登入者身分（頭像＋姓名）。未登入時整塊不佔位。 -->
    <span class="who-chip" id="who-chip" hidden>
      <span class="avatar-slot" id="who-avatar"></span>
      <span class="who-text">
        <span class="who-name" id="who-name">—</span>
        <span class="who-role" id="who-role" hidden></span>
      </span>
    </span>

    <!-- 桌機直接顯示在頁首；手機版收進右邊的漢堡選單（見 common.js） -->
    <span id="admin-badge" class="badge badge-admin hdr-desktop" hidden>管理員</span>
    <a class="btn btn-ghost hdr-desktop" id="btn-add" href="admin.html" hidden>＋ 新增事件</a>
    <a class="btn btn-ghost hdr-desktop" id="link-admin" href="admin.html">管理員登入</a>

    <button class="nav-toggle" id="nav-toggle" type="button"
            aria-label="更多功能" aria-expanded="false" aria-controls="nav-menu">☰</button>
  </div>

  <!-- 手機的漢堡選單內容（開關由 common.js 控制） -->
  <div class="nav-menu" id="nav-menu" hidden>
    <a class="nav-menu-item" id="menu-admin" href="admin.html">管理員登入</a>
    <a class="nav-menu-item" id="menu-add" href="admin.html" hidden>＋ 新增事件</a>
  </div>
</header>

<main class="wrap">

  <!-- 今日行程：取代原本的四格統計列。
       只放「今天」的行程，字放大、用 GSAP 呼吸字突顯。 -->
  <section class="today-panel" id="today-panel" hidden>
    <div class="today-head">
      <span class="today-label">今日行程</span>
      <span class="today-date" id="today-date">—</span>
      <span class="today-count" id="today-count" hidden></span>
    </div>
    <div class="today-body" id="today-body"></div>
  </section>

  <div class="toolbar">
    <button class="btn" id="btn-prev" type="button" aria-label="上個月">‹ 上月</button>
    <button class="btn" id="btn-today" type="button">今天</button>
    <button class="btn" id="btn-next" type="button" aria-label="下個月">下月 ›</button>
    <span class="month-label" id="month-label">—</span>
    <span class="spacer"></span>
    <button class="btn btn-ghost" id="btn-view" type="button" hidden>切換列表</button>
  </div>

  <div class="card" data-sec="navy">
    <div id="calendar"></div>
    <div class="loading" id="loading">
      <div class="skeleton" style="width:60%"></div>
      <div class="skeleton" style="width:85%"></div>
      <div class="skeleton" style="width:45%"></div>
    </div>
    <div class="empty" id="empty" hidden>本月尚無行程</div>
    <div class="error-box" id="error" hidden></div>
  </div>

  <div class="legend" id="legend"></div>

</main>

<footer class="site-footer">
  <div>機械與自動化工程系｜系辦分機 2102</div>
</footer>

<!-- 事件詳情 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="m-title">—</h3>
    <p><strong>時間：</strong><span id="m-time">—</span></p>
    <p><strong>類別：</strong><span id="m-cat">—</span></p>
    <p id="m-loc-wrap"><strong>地點：</strong><span id="m-loc">—</span></p>
    <p id="m-att-wrap" hidden><strong>出席人員：</strong><span id="m-att" class="m-att"></span></p>
    <p id="m-desc-wrap"><strong>說明：</strong><br><span id="m-desc">—</span></p>
    <div class="modal-actions">
      <!-- 刪除放最左邊、跟其他鈕隔開：破壞性動作不要跟「關閉」擠在一起，
           手指滑過去誤按的代價太高。 -->
      <button class="btn btn-danger act-left" id="m-delete" type="button" hidden>刪除</button>
      <button class="btn" id="m-close" type="button">關閉</button>
      <button class="btn btn-primary" id="m-edit" type="button" hidden>修改</button>
    </div>
  </div>
</div>

<!-- 刪除確認（刪掉就沒了，一定要再問一次） -->
<div class="modal" id="del-modal">
  <div class="modal-box modal-box-sm">
    <h3>刪除事件</h3>
    <p id="del-text">—</p>
    <div class="modal-actions">
      <button class="btn" id="del-cancel" type="button">取消</button>
      <button class="btn btn-danger-solid" id="del-ok" type="button">確定刪除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 新增事件（在月曆日期上連點兩下就會打開，日期已自動帶入） -->
<div class="modal" id="add-modal">
  <div class="modal-box modal-box-form">
    <h3 id="a-heading">新增事件</h3>
    <p class="hint" id="a-when" style="margin-top:-8px">—</p>
    <form id="add-form" novalidate>
      <div class="field">
        <label for="a-title-input">標題</label>
        <input type="text" id="a-title-input" placeholder="例：系務會議" required>
      </div>

      <div class="field">
        <label for="a-category">類別</label>
        <select id="a-category"></select>
      </div>

      <div class="field">
        <label class="check-line" for="a-allday">
          <input type="checkbox" id="a-allday"> 全天事件（沒有特定時間）
        </label>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="a-start-date">開始日期</label>
          <input type="date" id="a-start-date" required>
        </div>
        <div class="field" id="wrap-a-start-time">
          <label for="a-start-time">開始時間</label>
          <input type="time" id="a-start-time">
        </div>
        <div class="field">
          <label for="a-end-date">結束日期</label>
          <input type="date" id="a-end-date" required>
        </div>
        <div class="field" id="wrap-a-end-time">
          <label for="a-end-time">結束時間</label>
          <input type="time" id="a-end-time">
        </div>
      </div>

      <div class="field">
        <label for="a-location">地點 <span class="hint">（選填）</span></label>
        <input type="text" id="a-location" placeholder="例：機414">
      </div>

      <div class="field">
        <label for="a-attendees">出席人員 <span class="hint">（選填，一行一位或一段列出）</span></label>
        <textarea id="a-attendees" rows="3"
                  placeholder="例：主持人：楊至誠院長&#10;委員：徐金全主任、陳建良主任&#10;列席人員：邱炳儒主任"></textarea>
      </div>

      <div class="field">
        <label for="a-description">說明 <span class="hint">（選填）</span></label>
        <textarea id="a-description" placeholder="補充說明、討論議題、備註…"></textarea>
      </div>

      <div class="field-error" id="a-error" hidden></div>

      <div class="modal-actions">
        <button class="btn" type="button" id="a-cancel">取消</button>
        <button class="btn btn-primary" type="submit" id="a-save">新增</button>
      </div>
    </form>
  </div>
</div>

<!-- 載入保險（必須在 assets/*.js 之前）：
     月曆初始化期間若有任何未捕捉的例外，載入骨架（#loading）會永遠蓋在畫面上，
     使用者只看到一片灰條、完全不知道發生什麼事。
     這裡在最前面就掛好全域攔截；若程式已自行處理（骨架已隱藏）就不插手。
     （實際發生過：部署途中開頁面，新舊 JS 混搭導致初始化中斷。） -->
<script>
  window.addEventListener('error', function () {
    var l = document.getElementById('loading');
    var e = document.getElementById('error');
    if (!l || l.hidden) return;          /* 已載入完成或已由程式處理 */
    l.hidden = true;
    if (e) { e.hidden = false; e.textContent = '頁面載入失敗，請重新整理。'; }
  });
</script>
<script src="assets/config.js?v=044a880c"></script>
<script src="assets/common.js?v=93f5f6b8"></script>
<script src="assets/calendar.js?v=985cb1ec"></script>
</body>
</html>
