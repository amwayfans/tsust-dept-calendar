<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理後台 — 系所行事曆</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css?v=2c35f27f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <div class="brand">
      <h1><span>系所行事曆 — 管理後台</span></h1>
      <p>僅限系辦管理員使用</p>
    </div>
    <nav class="site-tabs" aria-label="主要功能">
      <a href="index.html" class="tab">行事曆</a>
      <a href="records.html" class="tab">公差/招生記錄</a>
      <a href="survey.html" class="tab">調查專區</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- ===== 登入 ===== -->
  <section class="card" id="login-card" data-sec="navy" hidden>
    <h2 style="margin-top:0">系務人員登入</h2>
    <p class="hint" style="margin-top:-8px">系辦管理員與系務助理皆可登入管理事件；一般教師帳號無此權限。</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">電子郵件</label>
        <input type="email" id="email" autocomplete="username" placeholder="請輸入學校信箱" required>
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="請輸入密碼" required>
      </div>
      <div class="field-error" id="login-error" hidden></div>
      <div class="modal-actions" style="justify-content:flex-start">
        <button class="btn btn-primary" type="submit" id="btn-login">登入</button>
      </div>
    </form>

    <!-- LINE 登入：只有「已綁定」的帳號能用（綁定在「公差/招生記錄」頁） -->
    <div class="or-divider"><span>或</span></div>
    <button class="btn btn-line" type="button" id="btn-line-login">用 LINE 登入</button>
  </section>

  <!-- ===== 管理介面 ===== -->
  <section id="panel" hidden>

    <div class="toolbar">
      <span class="badge badge-admin" id="who">—</span>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="btn-new" type="button">＋ 新增事件</button>
      <button class="btn btn-danger" id="btn-logout" type="button">登出</button>
    </div>

    <!-- 表單 -->
    <div class="card" id="form-card" data-sec="gold" hidden>
      <h2 id="form-title" style="margin-top:0">新增事件</h2>
      <form id="event-form" novalidate>
        <input type="hidden" id="f-id">

        <div class="field">
          <label for="f-title">標題 <span class="hint">（必填，1–100 字）</span></label>
          <input type="text" id="f-title" maxlength="100" required>
          <div class="field-error" id="e-title" hidden></div>
        </div>

        <div class="row2">
          <div class="field">
            <label for="f-category">類別</label>
            <select id="f-category"></select>
          </div>
          <div class="field">
            <label for="f-visibility">可見性</label>
            <select id="f-visibility">
              <option value="department">全體人員都可查看</option>
              <option value="assistant">只有系務人員可以查看</option>
              <option value="private">僅管理員（不公開）</option>
            </select>
          </div>
        </div>

        <div class="field checkbox">
          <input type="checkbox" id="f-allday">
          <label for="f-allday" style="margin:0">全天事件</label>
        </div>

        <div class="field checkbox">
          <input type="checkbox" id="f-line-notify" checked>
          <label for="f-line-notify" style="margin:0">發送 LINE 通知
            <span class="hint">（每晚 21:00 推播到「台鋼機自系」群組）</span></label>
        </div>

        <div class="row2">
          <div class="field">
            <label for="f-start-date">開始日期 <span class="hint">（必填）</span></label>
            <input type="date" id="f-start-date" required>
          </div>
          <div class="field" id="wrap-start-time">
            <label for="f-start-time">開始時間</label>
            <input type="time" id="f-start-time" value="09:00">
          </div>
        </div>

        <div class="row2">
          <div class="field">
            <label for="f-end-date">結束日期 <span class="hint">（必填）</span></label>
            <input type="date" id="f-end-date" required>
          </div>
          <div class="field" id="wrap-end-time">
            <label for="f-end-time">結束時間</label>
            <input type="time" id="f-end-time" value="10:00">
          </div>
        </div>

        <div class="field-error" id="e-time" hidden></div>

        <div class="field">
          <label for="f-location">地點 <span class="hint">（選填，0–100 字）</span></label>
          <input type="text" id="f-location" maxlength="100">
        </div>

        <div class="field">
          <label for="f-description">說明 <span class="hint">（選填，0–1000 字）</span></label>
          <textarea id="f-description" maxlength="1000"></textarea>
        </div>

        <div class="modal-actions">
          <button class="btn" type="button" id="btn-cancel">取消</button>
          <button class="btn btn-primary" type="submit" id="btn-save">儲存</button>
        </div>
      </form>
    </div>

    <!-- 列表 -->
    <div class="card" data-sec="blue">
      <h2 style="margin-top:0">事件列表 <span class="hint" style="font-weight:400;color:var(--c-text-2);font-size:13px">（依開始時間，新的在前）</span></h2>
      <ul class="ev-list" id="list"></ul>
      <div class="empty" id="list-empty" hidden>目前沒有事件</div>
      <div class="error-box" id="list-error" hidden></div>
      <div class="loading" id="list-loading">
        <div class="skeleton" style="width:70%"></div>
        <div class="skeleton" style="width:50%"></div>
      </div>
    </div>

  </section>

  <div class="card" id="booting">
    <div class="skeleton" style="width:40%"></div>
    <div class="skeleton" style="width:65%"></div>
  </div>

</main>

<!-- 刪除確認 -->
<div class="modal" id="confirm">
  <div class="modal-box">
    <h3>確定要刪除嗎？</h3>
    <p id="confirm-text">—</p>
    <div class="modal-actions">
      <button class="btn" type="button" id="c-no">取消</button>
      <button class="btn btn-danger" type="button" id="c-yes">確定刪除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/config.js?v=5b5a2b84"></script>
<script src="assets/common.js?v=0b84c471"></script>
<script src="assets/admin.js?v=8745552f"></script>
</body>
</html>
