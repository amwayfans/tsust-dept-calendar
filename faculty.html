<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教師通訊錄 — 機械與自動化工程系</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css?v=27d86b33">
<link rel="stylesheet" href="assets/faculty.css?v=62b68dfe">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <div class="brand">
      <h1><span>教師通訊錄</span></h1>
      <p>專任與兼任教師聯絡資訊</p>
    </div>
    <nav class="site-tabs" aria-label="主要功能">
      <a href="index.html" class="tab">行事曆</a>
      <a href="records.html" class="tab">公差/招生記錄</a>
      <a href="survey.html" class="tab">調查專區</a>
      <a href="rooms.html" class="tab">教室課表</a>
      <a href="faculty.html" class="tab is-active" aria-current="page">教師通訊錄</a>
    </nav>

    <span class="who-chip" id="who-chip" hidden>
      <span class="avatar-slot" id="who-avatar"></span>
      <span class="who-text">
        <span class="who-name" id="who">—</span>
        <span class="who-role" id="who-role" hidden></span>
      </span>
    </span>

    <a class="btn btn-ghost hdr-desktop" href="admin.html" hidden>管理後台</a>
    <button class="nav-toggle" id="nav-toggle" type="button"
            aria-label="更多功能" aria-expanded="false" aria-controls="nav-menu">☰</button>
  </div>

  <div class="nav-menu" id="nav-menu" hidden>
    <a class="nav-menu-item" href="admin.html" hidden>管理後台</a>
    <span id="menu-user" hidden>
      <button class="nav-menu-item nav-menu-btn" id="btn-pw" type="button">修改密碼</button>
      <button class="nav-menu-item nav-menu-btn nav-menu-danger" id="btn-logout" type="button">登出</button>
    </span>
  </div>
</header>

<main class="wrap">

  <!-- ===================== 登入 ===================== -->
  <section class="card" id="login-card" data-sec="navy" hidden>
    <h2 style="margin-top:0">教師登入</h2>
    <p class="hint" style="margin-top:-8px">
      教師通訊錄需登入後才能查看。帳號由系辦建立，忘記密碼請洽系辦（分機 2102）。
    </p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">電子郵件</label>
        <input type="email" id="email" autocomplete="username" placeholder="請輸入學校信箱" required>
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="請輸入密碼" required>
      </div>
      <div class="field-error" id="login-error" hidden></div>
      <div class="modal-actions" style="justify-content:flex-start">
        <button class="btn btn-primary" type="submit" id="btn-login">登入</button>
      </div>
    </form>
    <div class="or-divider"><span>或</span></div>
    <button class="btn btn-line" type="button" id="btn-line-login">用 LINE 登入</button>
  </section>

  <!-- ===================== 主內容 ===================== -->
  <section id="app" hidden>

    <div class="card" data-sec="navy">
      <h2 style="margin-top:0">教師通訊錄</h2>
      <p class="hint" style="margin-top:-8px" id="fac-hint">載入中…</p>
      <div class="fac-modes" role="tablist">
        <button class="fac-mode is-active" data-kind="all" type="button">全部</button>
        <button class="fac-mode" data-kind="full" type="button">專任教師</button>
        <button class="fac-mode" data-kind="adj" type="button">兼任教師</button>
      </div>
      <div class="field" style="margin-top:14px">
        <label for="fac-q">搜尋</label>
        <input type="search" id="fac-q" placeholder="例：盧俊彰、Kung、岡山農工" autocomplete="off">
      </div>
      <p class="hint" id="fac-count" style="margin-bottom:0"></p>
    </div>

    <div id="fac-body"></div>

  </section>
</main>

<div class="toast" id="toast"></div>

<script src="assets/config.js?v=044a880c"></script>
<script src="assets/common.js?v=93f5f6b8"></script>
<script src="assets/faculty.js?v=8ac53dac"></script>
</body>
</html>
