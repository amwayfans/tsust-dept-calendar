<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教室課表 — 機械與自動化工程系</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css?v=57ed3607">
<link rel="stylesheet" href="assets/rooms.css?v=58a8ea7c">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <div class="brand">
      <h1><span>教室課表</span></h1>
      <p>查教室空堂 ／ 查老師在哪間教室上課</p>
    </div>
    <nav class="site-tabs" aria-label="主要功能">
      <a href="index.html" class="tab">行事曆</a>
      <a href="records.html" class="tab">公差/招生記錄</a>
      <a href="survey.html" class="tab">調查專區</a>
      <a href="rooms.html" class="tab is-active" aria-current="page">教室課表</a>
      <a href="faculty.html" class="tab" data-mobile-hide>教師通訊錄</a>
    </nav>

    <span class="who-chip" id="who-chip" hidden>
      <span class="avatar-slot" id="who-avatar"></span>
      <span class="who-text">
        <span class="who-name" id="who">—</span>
        <span class="who-role" id="who-role" hidden></span>
      </span>
    </span>

    <a class="btn btn-ghost hdr-desktop" href="admin.html" hidden>管理後台</a>
    <button class="nav-toggle" id="nav-toggle" type="button"
            aria-label="更多功能" aria-expanded="false" aria-controls="nav-menu">☰</button>
  </div>

  <div class="nav-menu" id="nav-menu" hidden>
    <a class="nav-menu-item" href="admin.html" hidden>管理後台</a>
    <span id="menu-user" hidden>
      <a class="nav-menu-item" data-menu-login-only href="faculty.html" hidden>教師通訊錄</a>
      <button class="nav-menu-item nav-menu-btn" id="btn-pw" type="button">修改密碼</button>
      <button class="nav-menu-item nav-menu-btn nav-menu-danger" id="btn-logout" type="button">登出</button>
    </span>
  </div>
</header>

<main class="wrap">

  <!-- ===================== 登入 ===================== -->
  <section class="card" id="login-card" data-sec="navy" hidden>
    <h2 style="margin-top:0">教師登入</h2>
    <p class="hint" style="margin-top:-8px">
      教室課表需登入後才能查詢。帳號由系辦建立，忘記密碼請洽系辦（分機 2102）。
    </p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">電子郵件</label>
        <input type="email" id="email" autocomplete="username" placeholder="請輸入學校信箱" required>
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="請輸入密碼" required>
      </div>
      <div class="field-error" id="login-error" hidden></div>
      <div class="modal-actions" style="justify-content:flex-start">
        <button class="btn btn-primary" type="submit" id="btn-login">登入</button>
      </div>
    </form>
    <div class="or-divider"><span>或</span></div>
    <button class="btn btn-line" type="button" id="btn-line-login">用 LINE 登入</button>
  </section>

  <!-- ===================== 主內容 ===================== -->
  <section id="app" hidden>

    <div class="card" data-sec="navy">
      <h2 style="margin-top:0">教室課表查詢</h2>
      <p class="hint" style="margin-top:-8px" id="semester-hint">載入中…</p>
      <div class="rs-modes" role="tablist">
        <button class="rs-mode is-active" data-mode="room" type="button">教室查詢</button>
        <button class="rs-mode" data-mode="mine" type="button">我的課表</button>
        <button class="rs-mode" data-mode="find" type="button">找老師／課程</button>
      </div>
    </div>

    <!-- ── 教室查詢 ───────────────────────────── -->
    <div id="pane-room">
      <div class="card">
        <div class="rs-picker-row">
          <label class="rs-picker-label" for="room-select">教室</label>
          <select class="rs-select" id="room-select" aria-label="選擇教室"></select>
          <span class="rs-picker-hint" id="room-count"></span>
        </div>
        <div class="rs-tools">
          <label class="rs-check">
            <input type="checkbox" id="only-free"> 只顯示空堂（這間教室哪幾節沒人用）
          </label>
          <span class="rs-now" id="now-label"></span>
        </div>
        <div class="rs-daytabs" id="day-tabs" hidden></div>

        <!-- 管理員才看得到（HTML 先 hidden，確認角色後才顯示 —— fail-closed） -->
        <div class="rs-manage" id="manage-bar" hidden>
          <span class="rs-manage-hint">管理員模式：點課表裡的課程可以直接修改、調教室</span>
          <button class="btn btn-primary" id="btn-add-course" type="button">＋ 新增課程</button>
        </div>
        <div class="rs-grid-wrap">
          <table class="rs-grid" id="grid"></table>
        </div>
        <p class="hint" id="room-note"></p>
      </div>
    </div>

    <!-- ── 我的課表 ───────────────────────────── -->
    <div id="pane-mine" hidden>
      <div class="card">
        <h3 class="rs-h3" id="mine-title">我的課表</h3>
        <!-- 管理員可以選任何一位老師（HTML 先 hidden，確認角色後才顯示） -->
        <div class="field" id="mine-picker" hidden>
          <label for="mine-teacher">查看哪位老師的課表</label>
          <select class="rs-select" id="mine-teacher"></select>
        </div>
        <div id="mine-body"></div>
      </div>
    </div>

    <!-- ── 找老師／課程 ───────────────────────── -->
    <div id="pane-find" hidden>
      <div class="card">
        <div class="field">
          <label for="find-q">輸入老師姓名或課程名稱</label>
          <input type="search" id="find-q" placeholder="例：盧俊彰、CNC銑床、材料力學" autocomplete="off">
        </div>
        <div id="find-body"></div>
      </div>
    </div>

  </section>
</main>

<div class="toast" id="toast"></div>

<!-- ===================== 教室課表：修改／新增（管理員） ===================== -->
<div class="modal" id="rs-edit-modal">
  <div class="modal-box modal-box-form">
    <button class="modal-x" type="button" id="rs-e-x" aria-label="關閉">✕</button>
    <h3 id="rs-e-title">修改課程</h3>
    <p class="hint" style="margin-top:-6px" id="rs-e-sub">調課或換教室就在這裡改。</p>

    <div class="grid2">
      <div class="field">
        <label for="rs-e-semester">學期</label>
        <input type="text" id="rs-e-semester" placeholder="例：115-1">
      </div>
      <div class="field">
        <label for="rs-e-room">教室</label>
        <input type="text" id="rs-e-room" list="rs-room-list" placeholder="例：機302">
        <datalist id="rs-room-list"></datalist>
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="rs-e-day">星期</label>
        <select id="rs-e-day">
          <option value="1">週一</option><option value="2">週二</option>
          <option value="3">週三</option><option value="4">週四</option>
          <option value="5">週五</option><option value="6">週六</option>
          <option value="7">週日</option>
        </select>
      </div>
      <div class="field">
        <label for="rs-e-period">節次</label>
        <select id="rs-e-period"></select>
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="rs-e-period-label">節次顯示文字</label>
        <input type="text" id="rs-e-period-label" placeholder="例：3 或 A">
      </div>
      <div class="field">
        <label for="rs-e-start">開始時間</label>
        <input type="text" id="rs-e-start" placeholder="例：10:10">
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="rs-e-end">結束時間</label>
        <input type="text" id="rs-e-end" placeholder="例：11:00">
      </div>
      <div class="field">
        <label for="rs-e-course">課程名稱</label>
        <input type="text" id="rs-e-course" placeholder="例：機械製圖">
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="rs-e-teacher">授課老師</label>
        <input type="text" id="rs-e-teacher" list="rs-teacher-list" placeholder="例：盧俊彰">
        <datalist id="rs-teacher-list"></datalist>
      </div>
      <div class="field">
        <label for="rs-e-class">班級</label>
        <input type="text" id="rs-e-class" placeholder="例：四技機自二甲（可留空）">
      </div>
    </div>

    <div class="field-error" id="rs-e-error" hidden></div>

    <div class="modal-actions">
      <button class="btn btn-danger act-left" id="rs-e-delete" type="button" hidden>刪除</button>
      <button class="btn" id="rs-e-cancel" type="button">取消</button>
      <button class="btn btn-primary" id="rs-e-save" type="button">儲存</button>
    </div>
  </div>
</div>

<!-- 刪除確認（刪掉就沒了，一定要再問一次） -->
<div class="modal" id="rs-del-modal">
  <div class="modal-box modal-box-sm">
    <button class="modal-x" type="button" id="rs-del-x" aria-label="關閉">✕</button>
    <h3>刪除這筆課程</h3>
    <p id="rs-del-text">—</p>
    <div class="modal-actions">
      <button class="btn" id="rs-del-cancel" type="button">取消</button>
      <button class="btn btn-danger-solid" id="rs-del-ok" type="button">確定刪除</button>
    </div>
  </div>
</div>

<script src="assets/config.js?v=044a880c"></script>
<script src="assets/common.js?v=69001e34"></script>
<script src="assets/rooms.js?v=787248c4"></script>
</body>
</html>
